<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08101f">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Knightline Preview</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="app" class="app-shell" data-screen="home">
    <header class="app-header" id="app-header" data-testid="app-header"></header>
    <main id="main-content" class="app-main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Primary navigation" data-testid="primary-navigation">
      <button class="nav-item" type="button" data-nav="home" data-testid="nav-home"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 10.8 12 3.7l8.5 7.1v9a.7.7 0 0 1-.7.7h-5.1v-6.2H9.3v6.2H4.2a.7.7 0 0 1-.7-.7Z"/></svg></span><span>Home</span></button>
      <button class="nav-item" type="button" data-nav="play" data-testid="nav-play"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 4.5 20 12 8 19.5Z" stroke-linejoin="round"/></svg></span><span>Play</span></button>
      <button class="nav-item" type="button" data-nav="learn" data-testid="nav-learn"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18l-1.8-5.4-5.7-1.8L10.2 9Z"/></svg></span><span>Learn</span></button>
      <button class="nav-item" type="button" data-nav="profile" data-testid="nav-profile"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.4-4 2.7-6.1 6.5-6.1s6.1 2.1 6.5 6.1"/></svg></span><span>Profile</span></button>
    </nav>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="bottom-sheet" class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true" tabindex="-1" data-testid="bottom-sheet">
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-scroll" id="sheet-scroll"></div>
  </section>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js" defer></script>
</body>
</html>
