<!doctype html><meta charset="utf-8"><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script><script>
let peer=null, connection=null, roomCode='';
const config={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
function tell(kind,more={}){try{ChessLinkNative.receive(JSON.stringify(Object.assign({kind},more)));}catch(e){}}
function cleanRoom(room){return String(room||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8)}
function closeRoom(){if(connection){try{connection.close()}catch(e){} connection=null}if(peer){try{peer.destroy()}catch(e){} peer=null}roomCode=''}
function watch(c,room){connection=c;c.on('open',()=>tell('connected',{name:(c.metadata&&c.metadata.name)||'Online friend',room}));c.on('data',frame=>{if(frame&&typeof frame==='object')tell('message',{frame})});c.on('close',()=>tell('lost'));c.on('error',()=>tell('lost'))}
function common(p,room){p.on('error',e=>tell('status',{text:e.type==='peer-unavailable'?'Room not found. Check the code.':'Online connection problem. Try again.'}));p.on('disconnected',()=>tell('lost'));p.on('connection',c=>watch(c,room))}
function hostRoom(room){closeRoom();roomCode=cleanRoom(room);if(roomCode.length<4){tell('status',{text:'Use a four-to-eight character room code.'});return}tell('status',{text:'Creating online room…'});try{peer=new Peer('chesslink-v1-'+roomCode,config);common(peer,roomCode);peer.on('open',()=>tell('status',{text:'Online room '+roomCode+' is ready. Share this code.'}))}catch(e){tell('status',{text:'PeerJS could not load. Check internet and try again.'})}}
function joinRoom(room,name){closeRoom();roomCode=cleanRoom(room);if(roomCode.length<4){tell('status',{text:'Use the room code your friend shared.'});return}tell('status',{text:'Joining online room…'});try{peer=new Peer(config);common(peer,roomCode);peer.on('open',()=>watch(peer.connect('chesslink-v1-'+roomCode,{reliable:true,metadata:{name:(name||'Guest').slice(0,24)}}),roomCode))}catch(e){tell('status',{text:'PeerJS could not load. Check internet and try again.'})}}
function sendFrame(raw){if(!connection||!connection.open)return;try{connection.send(JSON.parse(raw))}catch(e){tell('status',{text:'Could not send that move.'})}}
</script>
